[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-intelligence"
version = "2.0.0"
description = "Documentacion, analisis y auditoria de modelos semanticos de Power BI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Semantic Intelligence contributors" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = ["Jinja2>=3.1.6,<4"]

[project.optional-dependencies]
app = [
  "streamlit>=1.66,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
]
local-ai = [
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
]
ai = [
  "openai>=2,<3",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_intelligence = ["templates/*.j2", "resources/*.json", "resources/*.ps1"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
